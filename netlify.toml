[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Referrer muss bei immowelt ankommen (Modul ist an die Domain gebunden) – deshalb nicht "no-referrer"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://homepagemodul.immowelt.de; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://ms.immowelt.org; font-src 'self'; frame-src https://www.openstreetmap.org; connect-src 'self' https://nominatim.openstreetmap.org; form-action 'self'; base-uri 'self'"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# alte Jimdo-Adressen
